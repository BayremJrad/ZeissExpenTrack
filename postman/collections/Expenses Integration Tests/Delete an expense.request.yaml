$kind: http-request
order: 5000
url: '{{baseUrl}}/expenses/:id'
method: DELETE
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{expenseId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 204", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
